{% extends "base.html" %}

{% block title %}장비 수정{% endblock %}

{% block content %}
<h2>장비 수정</h2>

<form method="POST" action="/edit/{{ equipment.id }}">
    <div class="form-group">
        <label for="name">장비명:</label>
        <input type="text" id="name" name="name" value="{{ equipment.name }}" required>
    </div>

    <div class="form-group">
        <label for="category">분류:</label>
        <input type="text" id="category" name="category" value="{{ equipment.category }}" required>
    </div>

    <div class="form-group">
        <label for="rental_fee">대여료:</label>
        <input type="number" id="rental_fee" name="rental_fee" value="{{ equipment.rental_fee }}" required>
    </div>

    <div class="form-group">
        <label for="quantity">보유수량:</label>
        <input type="number" id="quantity" name="quantity" value="{{ equipment.quantity }}" required>
    </div>

    <div class="form-group">
        <label for="availability">대여가능여부:</label>
        <select id="availability" name="availability" required>
            <option value="가능" {% if equipment.availability == '가능' %}selected{% endif %}>가능</option>
            <option value="불가능" {% if equipment.availability == '불가능' %}selected{% endif %}>불가능</option>
        </select>
    </div>

    <div class="form-buttons">
        <button type="submit" class="btn-submit">수정</button>
        <a href="/" class="btn-cancel">취소</a>
    </div>
</form>
{% endblock %}
